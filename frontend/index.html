<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Halaman Login -->
    <main id="loginPage" class="login-page">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="brand">PERPUSTAKAAN</div>
            <h1 id="loginTitle">Login Mahasiswa</h1>
            <p class="muted">Silakan masuk untuk melihat dan meminjam buku.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="nim">NIM</label>
                    <input id="nim" name="nim" type="text" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>

                <p id="loginMessage" class="message" role="alert" aria-live="polite"></p>
                <button class="btn btn-primary btn-full" type="submit">Login</button>
            </form>

        </section>
    </main>

    <!-- Aplikasi Utama -->
    <div id="appPage" class="app-page hidden">
        <header class="navbar">
            <div class="nav-inner">
                <div class="brand">PERPUSTAKAAN</div>

                <nav aria-label="Navigasi utama">
                    <button class="nav-link active" data-section="booksSection" type="button">Daftar Buku</button>
                    <button class="nav-link" data-section="loansSection" type="button">Peminjaman</button>
                </nav>

                <div class="user-area">
                    <span id="userName"></span>
                    <button id="logoutButton" class="btn btn-secondary" type="button">Logout</button>
                </div>
            </div>
        </header>

        <div id="appMessage" class="app-message hidden" role="status" aria-live="polite"></div>

        <main class="container">
            <!-- Daftar Buku -->
            <section id="booksSection" class="app-section">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">KOLEKSI</p>
                        <h1>Daftar Buku</h1>
                        <p class="muted">Lihat ketersediaan dan pinjam buku yang masih tersedia.</p>
                    </div>
                    <div class="loan-counter" id="loanCounter">Peminjaman: 0 / 3</div>
                </div>

                <div id="bookList" class="book-grid"></div>
            </section>

            <!-- Informasi Peminjaman -->
            <section id="loansSection" class="app-section hidden">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">TRANSAKSI</p>
                        <h1>Buku yang Sedang Dipinjam</h1>
                        <p class="muted">Masa peminjaman setiap buku adalah 7 hari.</p>
                    </div>
                    <div class="loan-counter" id="loanCounterDetail">Peminjaman: 0 / 3</div>
                </div>

                <div id="loanList" class="loan-list"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
